<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>학년 통합 관리 시스템</title>
  <style>
    html, body { height: 100%; margin: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; background: #f8fafc; color: #1e293b; }
    #bar { position: fixed; top: 0; left: 0; right: 0; height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 10px; background: #fff; border-bottom: 1px solid #e2e8f0; z-index: 30; }
    #burger { border: 0; background: transparent; font-size: 22px; line-height: 1; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; color: #334155; }
    #burger:hover { background: #f1f5f9; }
    #title { font-weight: 800; color: #4338ca; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #pageName { color: #64748b; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #frame { position: absolute; top: 44px; bottom: 0; left: 0; width: 100%; height: calc(100% - 44px); border: 0; background: #f8fafc; }
    #overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, .35); z-index: 40; display: none; }
    #overlay.open { display: block; }
    #drawer { position: fixed; top: 0; bottom: 0; left: 0; width: 264px; max-width: 82vw; background: #fff; z-index: 50; transform: translateX(-100%); transition: transform .18s ease; overflow-y: auto; padding: 12px; box-sizing: border-box; box-shadow: 2px 0 12px rgba(0,0,0,.12); }
    #drawer.open { transform: translateX(0); }
    #drawerTitle { padding: 10px 10px 12px; font-weight: 800; color: #4338ca; line-height: 1.3; }
    .nav-item { display: block; padding: 9px 12px; font-size: 14px; color: #334155; border-radius: 8px; text-decoration: none; }
    .nav-item:hover { background: #eef2ff; }
    .nav-item.active { background: #e0e7ff; color: #3730a3; font-weight: 700; }
    .group { padding: 12px 12px 4px; font-size: 11px; font-weight: 700; color: #94a3b8; letter-spacing: .04em; }
  </style>
  <link rel="stylesheet" href="assets/css/themes.css?v=20261111h">
</head>
<body>
  <header id="bar">
    <button id="burger" aria-label="메뉴 열기">☰</button>
    <a id="title" href="#/home" title="홈으로" style="text-decoration:none;cursor:pointer"></a>
    <span id="pageName"></span>
    <div id="themeSel" role="group" aria-label="디자인 선택">
      <button data-theme="" title="기본 디자인">기본</button><button data-theme="flat" title="플랫 디자인">플랫</button><button data-theme="neu" title="뉴모피즘 디자인">뉴</button><button data-theme="clay" title="클레이모피즘 디자인">클레이</button>
    </div>
  </header>
  <div id="overlay"></div>
  <nav id="drawer"><div id="drawerTitle"></div></nav>
  <iframe id="frame" title="내용"></iframe>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/js/firebase-config.js?v=20261111h"></script>
<script>
(function () {
  // Firebase 도구는 여기서 한 번만 불러와 연결하고, 안쪽 페이지들이 그대로 가져다 씁니다(fb-boot.js).
  try { firebase.initializeApp(window.FIREBASE_CONFIG); firebase.firestore().settings({ experimentalAutoDetectLongPolling: true, ignoreUndefinedProperties: true }); } catch (e) { console.warn('firebase init failed', e); }
  var CFG = {
    apiKey: "AIzaSyDonpgXJGlSjqv-sFVAdlokpZ0XhONpjY0", authDomain: "gradeplanner-d5499.firebaseapp.com", projectId: "gradeplanner-d5499",
    storageBucket: "gradeplanner-d5499.firebasestorage.app", messagingSenderId: "1084828628942", appId: "1:1084828628942:web:255327f94a2be511d99d9f", measurementId: "G-R5VZNEYT45"
  };
  var meta = { year: (new Date().getMonth() >= 1 ? new Date().getFullYear() : new Date().getFullYear() - 1), grade: 6 };
  try { var c = JSON.parse(localStorage.getItem('gp_meta')); if (c && c.year) meta = c; } catch (e) {}

  var MENU = [
    ['홈', 'home'], ['__GRADE__학년 개요', 'overview'], ['학년 전체 명렬표', 'namelist'],
    ['시간표', null],
    ['기초 시간표', 'timetable-basic'], ['월간 시간표', 'timetable-monthly'], ['전담 시간표', 'timetable-special'],
    ['특별실 시간표', 'timetable-room'], ['반별 일정 조회', 'lookup-class'], ['강좌별 시간표 조회', 'lookup-course'],
    ['업무', null],
    ['예산', 'budget'], ['쇼핑몰 학교 ID', 'mall-id'], ['바로가기', 'links'], ['교실배치도', 'classroom'], ['내선번호', 'extension'],
    ['관리', null],
    ['학년 관리자', 'admin']
  ];
  var curPage = '', MAXW = { 'timetable-basic': 0, 'timetable-monthly': 0, 'timetable-special': 0, 'timetable-room': 0, 'lookup-class': 0, 'lookup-course': 0, 'budget': 0, 'namelist': 0 },
    // 위쪽 메뉴줄은 화면 끝까지, 본문만 폭 제한 (선택자 = 본문 상자)
    INNER = { 'lookup-class': '.max-w-7xl', 'lookup-course': '.max-w-7xl', 'budget': '.max-w-7xl', 'namelist': '.page-section' },
    // 화면 넓게 보기(↔ 버튼): 1단계 = 기본 폭, 2단계 = 넓게, 3단계 = 화면 전체
    WIDE = { 'budget': 1, 'namelist': 1 }, WIDE_STEPS = [1230, 1600, 0], SCROLLW = { 'timetable-basic': 1700, 'timetable-special': 1600, 'timetable-room': 1600 }, DEFW = 1230;
  // 세로 스크롤은 브라우저 맨 오른쪽(iframe 가장자리)에 두고, 본문만 페이지별 최대 폭으로 가운데 정렬합니다.
  function applyWidth() {
    try {
      var b = frame.contentDocument && frame.contentDocument.body; if (!b) return;
      var w = Object.prototype.hasOwnProperty.call(MAXW, curPage) ? MAXW[curPage] : DEFW;
      // 내부에서 스크롤되는 페이지는 스크롤 영역을 화면 전체 폭으로 두고, 안쪽 여백으로 본문 폭을 맞춥니다(스크롤바가 맨 오른쪽에 위치).
      var sw = SCROLLW[curPage], d = frame.contentDocument, st = d.getElementById('gp-width');
      if (!st) { st = d.createElement('style'); st.id = 'gp-width'; d.head.appendChild(st); }
      var pad = function (px, min) { return 'padding-left:max(' + min + ',calc((100% - ' + px + 'px)/2)) !important;padding-right:max(' + min + ',calc((100% - ' + px + 'px)/2)) !important;'; };
      st.textContent = !sw ? '' :
        (curPage === 'timetable-room'
          ? '.scroll-container{' + pad(sw, '1rem') + '}.max-w-5xl.mx-auto.h-full,.max-w-6xl.mx-auto.h-full{max-width:none !important;' + pad(DEFW, '1.5rem') + '}'
          : '.flex-1.overflow-y-auto{' + pad(sw, '1rem') + '}');
      var inner = INNER[curPage];
      if (inner) { var iw = WIDE[curPage] ? WIDE_STEPS[wideStep(curPage)] : DEFW; st.textContent += inner + '{max-width:' + (iw ? iw + 'px' : 'none') + ' !important;margin-left:auto !important;margin-right:auto !important}'; }
      try { if (frame.contentWindow.__gpWideChanged) frame.contentWindow.__gpWideChanged(wideStep(curPage)); } catch (e) {}
      b.style.maxWidth = w ? w + 'px' : 'none'; b.style.marginLeft = 'auto'; b.style.marginRight = 'auto'; b.style.boxSizing = 'border-box';
    } catch (e) {}
  }
  function wideStep(pg) { var v = 0; try { v = parseInt(localStorage.getItem('gp_wide_' + pg), 10) || 0; } catch (e) {} return Math.max(0, Math.min(2, v)); }
  // 안쪽 페이지의 ↔ 버튼이 부릅니다: 누를 때마다 기본 → 넓게 → 화면 전체 → 기본 …
  window.__gpWiden = function () { if (!WIDE[curPage]) return 0; var n = (wideStep(curPage) + 1) % 3; try { localStorage.setItem('gp_wide_' + curPage, n); } catch (e) {} applyWidth(); return n; };
  window.__gpWideStep = function () { return wideStep(curPage); };
  document.getElementById('frame').addEventListener('load', applyWidth);
  // 디자인 보기(기본/플랫/뉴/클레이): 색·그림자·모서리·아이콘 모양만 바꾸는 스타일을 바깥 화면과 안쪽 페이지에 함께 적용합니다.
  var THEME = ''; try { THEME = localStorage.getItem('gp_theme') || ''; } catch (e) {}
  function applyTheme() {
    var fr = document.getElementById('frame'); [document, fr && fr.contentDocument].forEach(function (d) {
      try {
        if (!d || !d.documentElement) return;
        if (THEME) d.documentElement.setAttribute('data-gp-theme', THEME); else d.documentElement.removeAttribute('data-gp-theme');
        if (d !== document && d.head && !d.getElementById('gp-theme-css')) { var l = d.createElement('link'); l.id = 'gp-theme-css'; l.rel = 'stylesheet'; l.href = '../assets/css/themes.css?v=20261111h'; d.head.appendChild(l); }
        if (d !== document && d.head && THEME && !d.getElementById('gp-theme-icons')) { var sc = d.createElement('script'); sc.id = 'gp-theme-icons'; sc.src = '../assets/js/theme-icons.js?v=20261111h'; d.head.appendChild(sc); }   // 디자인에 맞는 아이콘 그림 (기본 디자인일 때는 불러오지 않음)
      } catch (e) {}
    });
    [].forEach.call(document.querySelectorAll('#themeSel button'), function (b) { b.classList.toggle('on', (b.getAttribute('data-theme') || '') === THEME); });
  }
  [].forEach.call(document.querySelectorAll('#themeSel button'), function (b) {
    b.addEventListener('click', function () { THEME = b.getAttribute('data-theme') || ''; try { localStorage.setItem('gp_theme', THEME); } catch (e) {} applyTheme(); });
  });
  document.getElementById('frame').addEventListener('load', applyTheme);
  applyTheme();
  var drawer = document.getElementById('drawer'), overlay = document.getElementById('overlay'), frame = document.getElementById('frame');
  var items = [];
  MENU.forEach(function (m) {
    if (!m[1]) { var g = document.createElement('div'); g.className = 'group'; g.textContent = m[0]; drawer.appendChild(g); return; }
    var a = document.createElement('a'); a.className = 'nav-item'; a.href = '#/' + m[1]; a.dataset.page = m[1]; a.dataset.label = m[0]; drawer.appendChild(a); items.push(a);
  });
  function labelOf(a) { return a.dataset.label.replace('__GRADE__', meta.grade); }
  function applyMeta() {
    var t = meta.year + '학년도 ' + meta.grade + '학년 통합 관리 시스템';
    document.getElementById('title').textContent = t; document.getElementById('drawerTitle').textContent = t; document.title = t;
    items.forEach(function (a) { a.textContent = labelOf(a); });
    var cur = items.filter(function (a) { return a.classList.contains('active'); })[0]; document.getElementById('pageName').textContent = cur ? '· ' + labelOf(cur) : '';
  }
  function setOpen(v) { drawer.classList.toggle('open', v); overlay.classList.toggle('open', v); }
  document.getElementById('burger').onclick = function () { setOpen(!drawer.classList.contains('open')); };
  overlay.onclick = function () { setOpen(false); };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
  function route() {
    var page = location.hash.replace('#/', '') || 'home';
    curPage = page;
    frame.src = 'pages/' + page + '.html?v=20261111h';
    items.forEach(function (a) { a.classList.toggle('active', a.dataset.page === page); });
    setOpen(false); applyMeta();
  }
  window.addEventListener('hashchange', route); route();

  // 학년도/학년은 관리자 설정(app_config/general)에서 가져옵니다. (화면은 저장된 값으로 먼저 그림)
  function loadScript(src) { return new Promise(function (res, rej) { var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
  function getDb() { try { return Promise.resolve(firebase.firestore()); } catch (e) { return Promise.reject(e); } }
  function refreshMeta() {
    getDb().then(function (db) { return db.collection('app_config').doc('general').get(); }).then(function (snap) {
      var g = snap.exists && snap.data() && snap.data().json ? JSON.parse(snap.data().json) : {};
      var next = { year: g.year || meta.year, grade: g.grade || 6 };
      if (next.year !== meta.year || next.grade !== meta.grade) { meta = next; applyMeta(); }
      try { localStorage.setItem('gp_meta', JSON.stringify(meta)); } catch (e) {}
    }).catch(function (e) { console.warn('title load failed', e); });
  }
  window.addEventListener('message', function (e) { if (e.data === 'gp-meta-changed') refreshMeta(); });
  window.addEventListener('load', function () { setTimeout(refreshMeta, 300); });
})();
</script>
</body>
</html>
