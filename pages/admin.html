<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>학년 관리자</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/gas-shim.js"></script>
  <script src="../assets/js/app-data.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body{font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR',sans-serif;background:#f8fafc}</style>
</head>
<body class="text-slate-800">
  <div id="gate" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow border border-slate-200 p-6 w-full max-w-sm space-y-3">
      <h1 class="text-xl font-bold">학년 관리자</h1>
      <p class="text-sm text-slate-500">관리자 비밀번호를 입력하세요.</p>
      <input id="pw" type="password" autocomplete="off" class="w-full border rounded-lg px-3 py-2" placeholder="비밀번호" autofocus>
      <p id="pwErr" class="text-sm text-red-600 hidden">비밀번호가 일치하지 않습니다.</p>
      <button id="login" class="w-full px-4 py-2 rounded-lg bg-indigo-600 text-white font-semibold">확인</button>
    </div>
  </div>
  <div id="app" class="hidden p-4 md:p-6">
    <div class="max-w-[1400px] mx-auto space-y-4">
      <div class="flex items-center justify-between"><h1 class="text-2xl font-bold">학년 관리자</h1><button id="lock" class="text-sm px-3 py-1.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-50">잠금</button></div>
      <div id="tabs" class="flex flex-wrap border-b border-slate-200"></div>
      <div id="view"></div>
    </div>
  </div>
  <div id="toast" class="hidden"></div>
  <script src="../assets/js/admin-ui.js"></script>
</body>
</html>
