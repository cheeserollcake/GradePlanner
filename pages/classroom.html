<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>교실배치도</title>
  <link rel="stylesheet" href="../assets/css/tw-base.css?v=20261113f">
  <script src="../assets/js/fb-boot.js?v=20261113f"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="../assets/js/firebase-config.js?v=20261113f"></script>
  <script src="../assets/js/gas-shim.js?v=20261113f"></script>
  <style>body{font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR',sans-serif;background:#f8fafc}</style>
  <link rel="stylesheet" href="../assets/css/tw-util.css?v=20261113f">
</head>
<body class="p-4 md:p-6 text-slate-800">
<div class="max-w-5xl mx-auto space-y-4">
  <div class="flex items-center justify-between"><h1 class="text-2xl font-bold">교실배치도</h1>
    <label class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold cursor-pointer">이미지 올리기<input id="file" type="file" accept="image/*" class="hidden"></label></div>
  <div id="view" class="bg-white border border-slate-200 rounded-xl shadow-sm p-3 text-center"></div>
</div>
<script>
async function load(){
  const v=document.getElementById('view');
  try{
    const src=await GP.classroomGet();
    if(!src){ v.innerHTML='<p class="text-slate-400 py-10">등록된 교실배치도가 없습니다.</p>'; return; }
    v.innerHTML='<img class="max-w-full h-auto mx-auto" src="'+src+'">';
  }catch(e){ v.innerHTML='<p class="text-red-500 py-10">불러오기 실패: '+e.message+'</p>'; }
}
document.getElementById('file').onchange=async(e)=>{
  const f=e.target.files[0]; if(!f) return; const v=document.getElementById('view');
  v.innerHTML='<p class="text-slate-500 py-10">올리는 중...</p>';
  try{ await GP.classroomPut(f); }catch(err){ v.innerHTML='<p class="text-red-500 py-10">업로드 실패: '+(err&&err.message||err)+'</p>'; e.target.value=''; return; }
  e.target.value=''; load();
};
load();
</script></body></html>
