<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>홈</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/gas-shim.js"></script>
  <script src="../assets/js/app-data.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; background:#f8fafc; }
    .cell { white-space: pre-wrap; word-break: keep-all; }
    .row-sat { background:#e0f2fe; color:#2563eb; }
    .row-sun { background:#fce7f3; color:#dc2626; }
    .row-today td:first-child { box-shadow: inset 4px 0 0 #4f46e5; }
  </style>
</head>
<body class="p-4 md:p-6 text-slate-800">
<div class="max-w-6xl mx-auto space-y-4">
  <div class="flex items-end justify-between">
    <div><h1 class="text-2xl font-bold">주요 일정</h1><p id="range" class="text-sm text-slate-500 mt-1"></p></div>
    <button id="reload" class="text-sm px-3 py-1.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-50">새로고침</button>
  </div>
  <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-x-auto">
    <table class="w-full text-sm min-w-[640px]" style="table-layout:fixed;width:100%">
      <colgroup><col style="width:7.5rem"><col><col><col></colgroup>
      <thead class="bg-slate-100 text-slate-600"><tr>
        <th class="p-2 border-b">날짜</th><th class="p-2 border-b">학교 행사</th><th class="p-2 border-b">학년 강사 일정</th><th class="p-2 border-b">학년 일정</th>
      </tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
  <p id="msg" class="text-center text-slate-400 hidden"></p>
</div>
<script>
const DAYN = ['일','월','화','수','목','금','토'];
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function load() {
  const body = document.getElementById('body'), msg = document.getElementById('msg');
  try {
    ['data_task_school','data_task_memo','data_add_timetable','data_basic'].forEach(GP.invalidate);
    const t = new Date(); const today = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    const end = GP.addDays(today, 6);
    document.getElementById('range').textContent = GP.appDate(today) + ' ~ ' + GP.appDate(end);
    const rows = await APP.buildSchedule(today, end);
    body.innerHTML = rows.map((r) => {
      const cls = (r.isHoliday || r.dow === 0) ? 'row-sun' : r.dow === 6 ? 'row-sat' : '';
      return '<tr class="border-b last:border-0 align-top ' + cls + (r.key === GP.ymd(today) ? ' row-today' : '') + '">' +
        '<td class="p-2 font-bold whitespace-nowrap">' + (r.date.getMonth() + 1) + '/' + r.date.getDate() + ' (' + DAYN[r.dow] + ')</td>' +
        '<td class="p-2 cell">' + esc(r.school) + '</td><td class="p-2 cell">' + esc(r.lecturer) + '</td><td class="p-2 cell">' + esc(r.memo) + '</td></tr>';
    }).join('');
  } catch (e) { console.error(e); msg.textContent = '일정을 불러오지 못했습니다: ' + e.message; msg.classList.remove('hidden'); }
}
document.getElementById('reload').onclick = load; load();
</script>
</body>
</html>
