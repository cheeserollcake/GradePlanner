<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>바로가기</title>
  <link rel="stylesheet" href="../assets/css/tw-base.css?v=20261114e">
  <script src="../assets/js/fb-boot.js?v=20261114e"></script>
  <script src="../assets/js/firebase-config.js?v=20261114e"></script>
  <script src="../assets/js/gas-shim.js?v=20261114e"></script>
  <style>body{font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR',sans-serif;background:#f8fafc}
  .card.dragging{opacity:.6;box-shadow:0 8px 24px rgba(0,0,0,.2)}
  .tools .grip{cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;font-style:normal;padding:4px 6px;letter-spacing:-2px;color:#6b7280}
  .tools button{padding:4px 5px;border-radius:6px;background:transparent;border:0;cursor:pointer;line-height:1;font-size:14px}
  .tools button:hover{background:rgba(0,0,0,.07)}
  .pop{position:fixed;z-index:60;background:#fff;border:1px solid #cbd5e1;border-radius:10px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:none;width:176px;flex-wrap:wrap;gap:6px}
  .pop button.sw{width:30px;height:30px;border-radius:8px;border:2px solid #fff;box-shadow:0 0 0 1px #cbd5e1}
  .pop button.none{width:100%;font-size:12px;padding:4px;border-radius:6px;background:#f1f5f9}
</style>
  <link rel="stylesheet" href="../assets/css/tw-util.css?v=20261114e">
</head>
<body class="p-4 md:p-6 text-slate-800">
<div class="max-w-4xl mx-auto space-y-4">
  <div class="flex items-center justify-between"><h1 class="text-2xl font-bold">바로가기</h1>
    <button id="add" class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold">+ 추가</button></div>
  <div id="list" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
  <p id="empty" class="text-center text-slate-400 py-10 hidden">등록된 바로가기가 없습니다. 오른쪽 위 [+ 추가]로 등록하세요.</p>
</div>
<div id="colorPop" class="pop"></div>
<div id="modal" class="hidden fixed inset-0 bg-black/40 z-50 items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-5 space-y-3">
    <h3 class="font-bold text-lg">바로가기 추가</h3>
    <label class="block text-sm font-semibold">이름<input id="fName" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm font-normal" placeholder="예: 학교 홈페이지" maxlength="60"></label>
    <label class="block text-sm font-semibold">주소(URL)<input id="fUrl" inputmode="url" autocapitalize="off" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm font-normal" placeholder="https://"></label>
    <label class="block text-sm font-semibold">메모 <span class="font-normal text-slate-400">(선택)</span><textarea id="fMemo" rows="2" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm font-normal" placeholder="이름 아래에 작게 표시됩니다"></textarea></label>
    <p id="fErr" class="text-sm font-semibold text-red-600 hidden"></p>
    <div class="flex justify-end gap-2 pt-1"><button id="fNo" class="px-4 py-2 rounded-lg bg-slate-100 text-sm font-semibold">취소</button><button id="fOk" class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold">추가</button></div>
  </div>
</div>
<script>
const esc=(s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=(id)=>document.getElementById(id);
const PALETTE=[['#fee2e2','빨강'],['#ffedd5','주황'],['#fef9c3','노랑'],['#dcfce7','초록'],['#dbeafe','파랑'],['#ede9fe','보라'],['#fce7f3','분홍'],['#e5e7eb','회색']];
const TRASH='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v7M14 10v7"/></svg>';
let cur=[];
async function load(){
  const rows=(await GP.getCol('data_links')).sort((a,b)=>(a.order||0)-(b.order||0)); cur=rows;
  $('empty').classList.toggle('hidden',rows.length>0);
  $('list').innerHTML=rows.map(r=>'<div data-card="'+r._id+'" class="card border border-slate-200 rounded-xl p-4 shadow-sm flex items-start justify-between gap-2" style="background:'+esc(r.color||'#fff')+'">'+
   '<div class="min-w-0"><a class="font-bold text-blue-600 hover:underline break-all" target="_blank" rel="noopener" href="'+esc(/^https?:\/\//i.test(String(r.url||'').trim())?String(r.url).trim():'https://'+String(r.url||'').trim().replace(/^[a-z]+:/i,''))+'">'+esc(r.name||r.url)+'</a>'+
   (r.memo?'<div class="text-sm text-black mt-0.5 whitespace-pre-line break-words">'+esc(r.memo)+'</div>':'')+'</div>'+
   '<div class="tools shrink-0 flex items-center text-slate-500"><i class="grip" title="끌어서 순서 변경">⠿</i><button data-color="'+r._id+'" title="배경색">🎨</button><button data-id="'+r._id+'" class="del hover:text-red-600" title="삭제">'+TRASH+'</button></div></div>').join('');
  document.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{ if(confirm('삭제할까요?')){ await GP.commit([{type:'delete',col:'data_links',id:b.dataset.id}]); load(); }});
  document.querySelectorAll('[data-color]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); openColor(b); });
}
// ---- 배경색 ----
let colorFor=null;
function openColor(btn){
  colorFor=btn.dataset.color; const pop=$('colorPop'); const r=btn.getBoundingClientRect();
  pop.innerHTML=PALETTE.map(([c,n])=>'<button class="sw" data-c="'+c+'" title="'+n+'" style="background:'+c+'"></button>').join('')+'<button class="none" data-c="">색 없음</button>';
  pop.style.display='flex'; pop.style.left=Math.max(4,Math.min(r.left,window.innerWidth-190))+'px'; pop.style.top=(r.bottom+4)+'px';
}
$('colorPop').addEventListener('click',async(e)=>{ const b=e.target.closest('[data-c]'); if(!b||!colorFor) return; const id=colorFor, c=b.dataset.c; colorFor=null; $('colorPop').style.display='none';
  const row=cur.find(x=>x._id===id); if(row) row.color=c; const el=document.querySelector('[data-card="'+id+'"]'); if(el) el.style.background=c||'#fff';
  await GP.commit([{type:'set',merge:true,col:'data_links',id,data:{color:c}}]); });
document.addEventListener('pointerdown',(e)=>{ if(!e.target.closest('#colorPop')&&!e.target.closest('[data-color]')) $('colorPop').style.display='none'; });
// ---- 끌어서 순서 변경 (마우스·터치 공통) ----
let drag=null;
$('list').addEventListener('pointerdown',(e)=>{ const g=e.target.closest('.grip'); if(!g) return; const card=g.closest('.card'); e.preventDefault();
  drag={card,id:card.dataset.card}; card.classList.add('dragging'); try{ $("list").setPointerCapture(e.pointerId); }catch(_){} });
$('list').addEventListener('pointermove',(e)=>{ if(!drag) return; const list=$('list');
  const el=document.elementFromPoint(e.clientX,e.clientY); const over=el&&el.closest('.card');
  if(over&&over!==drag.card&&list.contains(over)){ const r=over.getBoundingClientRect(); const after=(e.clientY>r.top+r.height/2)&&(e.clientX>r.left||true)&&(e.clientY-r.top>r.height/2); list.insertBefore(drag.card,after?over.nextSibling:over); }
  if(e.clientY<60) window.scrollBy(0,-12); else if(e.clientY>window.innerHeight-60) window.scrollBy(0,12); });
const endDrag=async()=>{ if(!drag) return; const d=drag; drag=null; d.card.classList.remove('dragging');
  const ids=[...$('list').children].map(c=>c.dataset.card); const ops=[];
  ids.forEach((id,i)=>{ const r=cur.find(x=>x._id===id); if(r&&r.order!==i+1){ r.order=i+1; ops.push({type:'set',merge:true,col:'data_links',id,data:{order:i+1}}); } });
  if(ops.length) await GP.commit(ops); };
$('list').addEventListener('pointerup',endDrag); $('list').addEventListener('pointercancel',endDrag);
const show=(v)=>{ $('modal').classList.toggle('hidden',!v); $('modal').classList.toggle('flex',v); };
$('add').onclick=()=>{ $('fName').value=''; $('fUrl').value=''; $('fMemo').value=''; $('fErr').classList.add('hidden'); show(true); $('fName').focus(); };
$('fNo').onclick=()=>show(false);
$('modal').addEventListener('keydown',(e)=>{ if(e.key==='Escape') show(false); });
$('fOk').onclick=async()=>{
  const name=$('fName').value.trim(); let url=$('fUrl').value.trim(); const memo=$('fMemo').value.trim();
  const err=!name?'이름을 입력하세요.':!url?'주소(URL)를 입력하세요.':''; if(err){ $('fErr').textContent=err; $('fErr').classList.remove('hidden'); return; }
  if(!/^https?:\/\//i.test(url)) url='https://'+url;
  $('fOk').disabled=true;
  try{ const rows=await GP.getCol('data_links'); const data={name,url,order:rows.length+1}; if(memo) data.memo=memo;
    await GP.commit([{type:'set',col:'data_links',id:GP.newId('data_links'),data}]); show(false); load();
  }catch(e){ $('fErr').textContent='저장하지 못했습니다: '+e.message; $('fErr').classList.remove('hidden'); }
  $('fOk').disabled=false;
};
load();
</script></body></html>
