      .admin-container { max-width: 500px; margin: 2rem auto; padding: 2rem; background: white; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
      .form-group { margin-bottom: 1.5rem; }

      .form-group input { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; box-sizing: border-box; }

        @page { size: A4; margin: 10mm; }

    .nl-table { table-layout: fixed; width: 100%; margin: 0 auto; box-sizing: border-box; }
      /* 좁은 화면: 열 너비는 내용이 잘리지 않는 크기(번호·성별·생년월일·삭제는 고정 px, 이름·기타는 나머지)이고, 화면보다 표가 넓으면 가로로 스크롤됩니다 */

      #root-class .overflow-x-auto, #root-grade .overflow-x-auto { overflow-x: auto; }

    <script src="../assets/js/xlsx-lite.js"></script>
    <script src="../assets/js/gsheet-export.js"></script>
    <script>
      (function () {
        const $ = (id) => document.getElementById(id);
        const GENDER = { '남성': 'male', '여성': 'female' };
        const LABEL = { no: '번호', name: '이름', gender: '성별', note: '기타', birth: '생년월일' }, IDX = { no: 0, name: 1, gender: 2, note: 3, birth: 4 };
        const WIDTH = { no: 6, name: 11, gender: 7, note: 16, birth: 14, chk: 7 };
        let CC = 10;   // 학급 수 (관리자 설정)
        const call = (name, ...args) => new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[name](...args));
        // 상단 메뉴 높이만큼 아래에 반 버튼줄을 고정
        const navH = () => { const n = $('navbar'); if (n) document.documentElement.style.setProperty('--nav-h', n.offsetHeight + 'px'); };
        window.addEventListener('resize', navH); setInterval(navH, 1500);
        async function loadCount() {
          try { const r = JSON.parse(await call('getGradeData')); CC = (r.horizontal && r.horizontal.classCount) || 10; } catch (e) { /* 기본값 */ }
          $('xl-class').innerHTML = Array.from({ length: CC }, (_, i) => '<option value="' + (i + 1) + '">' + (i + 1) + '반</option>').join('') + '<option value="all">전체 반 (반마다 시트)</option>';
        }
        $('xl-class').innerHTML = '<option value="1">1반</option>'; loadCount();
        const open = () => { loadCount(); $('xl-modal').style.display = 'flex'; }, close = () => { $('xl-modal').style.display = 'none'; };
        $('xl-open').onclick = open; $('xl-cancel').onclick = close;
        $('xl-modal').addEventListener('mousedown', (e) => { if (e.target === $('xl-modal')) close(); });
        const chk = $('xl-checks'); const setChk = (v) => { chk.value = Math.max(0, Math.min(30, Math.round(Number(v) || 0))); };
        $('xl-minus').onclick = () => setChk(Number(chk.value) - 1); $('xl-plus').onclick = () => setChk(Number(chk.value) + 1); chk.onchange = () => setChk(chk.value);
        document.querySelectorAll('input[name=xl-scope]').forEach((r) => r.onchange = () => { $('xl-class').disabled = document.querySelector('input[name=xl-scope]:checked').value !== 'class'; });
        $('xl-class').disabled = true;
        const save = (sheets, file) => {
          const a = document.createElement('a'); a.href = URL.createObjectURL(XlsxLite.toBlob(sheets)); a.download = file + '.xlsx';
          document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
        };
        const getClass = async (n) => { const r = JSON.parse(await call('getClassData', n)); if (!r.success) throw new Error(r.error); return r.data.slice(1); };
        const cell = (v, s) => ({ v, s });
        function rowCells(r, fields, nChk) {   // 한 학생(행)의 선택 항목 + 체크리스트 칸. 남/여 색은 줄 전체에 적용
          const st = GENDER[r[2]] || 'center'; const out = fields.map((f) => cell(f === 'no' ? Number(r[0]) : String(r[IDX[f]] == null ? '' : r[IDX[f]]), st));
          for (let i = 0; i < nChk; i++) out.push(cell('', st)); return out;
        }
        const headers = (fields, nChk) => fields.map((f) => cell(LABEL[f], 'totalLabel')).concat(Array.from({ length: nChk }, (_, i) => cell('체크' + (i + 1), 'totalLabel')));
        const widths = (fields, nChk) => fields.map((f) => WIDTH[f]).concat(Array.from({ length: nChk }, () => WIDTH.chk));
        function classSheet(n, rows, fields, nChk) {
          return { name: n + '반', widths: widths(fields, nChk), freezeRow: 2, rows: [[cell(n + '반 명렬표', 'title')], headers(fields, nChk)].concat(rows.map((r) => rowCells(r, fields, nChk))) };
        }
        function gradeSheet(all, fields, nChk) {   // 5개 반씩 가로로 나란히 (웹 화면과 같은 배치)
          const w = fields.length + nChk, rows = [], merges = [], wd = [];
          for (let c = 0; c < 5; c++) wd.push(...widths(fields, nChk), 2);
          const ref = (r, c) => XlsxLite.colName(c) + (r + 1);
          for (let start = 1, gi = 0; start <= CC; start += 5, gi++) {
            const per = Math.min(5, CC - start + 1);
            const top = rows.length, r1 = [], r2 = [], r3 = [];
            for (let c = 0; c < per; c++) {
              const data = all[start + c - 1] || []; let m = 0, f = 0; data.forEach((r) => { if (String(r[1]).trim()) { if (r[2] === '남성') m++; if (r[2] === '여성') f++; } });
              const fill = (t, s) => Array.from({ length: w }, (_, i) => cell(i === 0 ? t : '', s));
              r1.push(...fill((start + c) + '반', 'totalLabel'), cell('', 'default')); r2.push(...fill('재적: ' + (m + f) + ' (남' + m + '/여' + f + ')', 'totalLabel'), cell('', 'default')); r3.push(...headers(fields, nChk), cell('', 'default'));
              const base = c * (w + 1); if (w > 1) merges.push(ref(top, base) + ':' + ref(top, base + w - 1), ref(top + 1, base) + ':' + ref(top + 1, base + w - 1));
            }
            rows.push(r1, r2, r3);
            for (let i = 0; i < 30; i++) { const line = []; for (let c = 0; c < per; c++) { const d = (all[start + c - 1] || [])[i] || [i + 1, '', '', '', '']; line.push(...rowCells(d, fields, nChk), cell('', 'default')); } rows.push(line); }
            rows.push([]);
          }
          return { name: '학년 전체 명렬표', widths: wd, rows, merges };
        }
        async function build() {
          const fields = [...document.querySelectorAll('.xl-f:checked')].map((x) => x.value), nChk = Number(chk.value) || 0;
          if (!fields.length && !nChk) throw new Error('내려받을 항목을 하나 이상 선택하세요.');
          const scope = document.querySelector('input[name=xl-scope]:checked').value;
          if (scope === 'grade') { const all = []; for (let n = 1; n <= CC; n++) all.push(await getClass(n)); return { sheets: [gradeSheet(all, fields, nChk)], file: '학년_전체_명렬표' }; }
          if ($('xl-class').value === 'all') {
            const sheets = []; for (let n = 1; n <= CC; n++) { const d = await getClass(n); if (d.some((r) => String(r[1]).trim())) sheets.push(classSheet(n, d, fields, nChk)); }
            if (!sheets.length) throw new Error('명단이 입력된 반이 없습니다.'); return { sheets, file: '반별_명렬표_전체' };
          }
          const n = Number($('xl-class').value); return { sheets: [classSheet(n, await getClass(n), fields, nChk)], file: n + '반_명렬표' };
        }
        const btns = () => [$('xl-go'), $('xl-gs')];
        $('xl-go').onclick = async () => {
          btns().forEach((b) => { b.disabled = true; }); const old = $('xl-go').textContent; $('xl-go').textContent = '만드는 중…';
          try { const r = await build(); save(r.sheets, r.file); close(); } catch (e) { alert('엑셀을 만들지 못했습니다: ' + (e.message || e)); }
          btns().forEach((b) => { b.disabled = false; }); $('xl-go').textContent = old;
        };
        $('xl-gs').onclick = async () => {
          btns().forEach((b) => { b.disabled = true; });
          try {
            const r = await build(); close();
            const out = await GSheet.create(r.file.replace(/_/g, ' '), r.sheets, (t) => { $('xl-msg').textContent = t; });
            $('xl-msg').innerHTML = '스프레드시트를 만들었습니다. <a target="_blank" rel="noopener" style="color:#2563eb;font-weight:700;text-decoration:underline" href="' + out.url + '">열기</a> (내 구글 드라이브에 저장됨)';
          } catch (e) { $('xl-msg').textContent = ''; alert('스프레드시트로 내보내지 못했습니다: ' + (e.message || e)); }
          btns().forEach((b) => { b.disabled = false; });
        };

        // ------------------------------------------------------------ 업로드 (xlsx 읽기)
        const u16 = (d, o) => d[o] | (d[o + 1] << 8), u32 = (d, o) => (d[o] | (d[o + 1] << 8) | (d[o + 2] << 16) | (d[o + 3] << 24)) >>> 0;
        async function unzip(buf) {
          const d = new Uint8Array(buf); let e = d.length - 22; while (e >= 0 && u32(d, e) !== 0x06054b50) e--;
          if (e < 0) throw new Error('엑셀(.xlsx) 파일이 아닙니다.');
          const n = u16(d, e + 10); let p = u32(d, e + 16); const files = {};
          for (let i = 0; i < n; i++) {
            if (u32(d, p) !== 0x02014b50) break;
            const method = u16(d, p + 10), csize = u32(d, p + 20), nl = u16(d, p + 28), el = u16(d, p + 30), cl = u16(d, p + 32), off = u32(d, p + 42);
            const name = new TextDecoder().decode(d.subarray(p + 46, p + 46 + nl)); p += 46 + nl + el + cl;
            const start = off + 30 + u16(d, off + 26) + u16(d, off + 28); const raw = d.subarray(start, start + csize);
            files[name] = { method, raw };
          }
          const get = async (name) => {
            const f = files[name]; if (!f) return null;
            if (f.method === 0) return new TextDecoder().decode(f.raw);
            const ds = new DecompressionStream('deflate-raw'); const w = ds.writable.getWriter(); w.write(f.raw); w.close();
            return new TextDecoder().decode(await new Response(ds.readable).arrayBuffer());
          };
          return { get, names: Object.keys(files) };
        }
        const xml = (t) => new DOMParser().parseFromString(t, 'application/xml');

    <!-- 4. 스크립트 (기능 로직 + React 코드) -->
    <script>
      // 탭 전환 및 로그인 관련 바닐라 JS 로직
      function openPage(pageName, elmnt) {
        var i, tabcontent, tablinks;
        tabcontent = document.getElementsByClassName("page-section");
        for (i = 0; i < tabcontent.length; i++) {
          tabcontent[i].style.display = "none";
          tabcontent[i].classList.remove('active');
        }
        tablinks = document.getElementsByClassName("tab-link");
        for (i = 0; i < tablinks.length; i++) {
          tablinks[i].classList.remove("active");
        }
        document.getElementById(pageName).style.display = "block";
        document.getElementById(pageName).classList.add('active');
        if(elmnt) elmnt.classList.add("active");
      }

      // 관리자 접근 체크 (서버 검증으로 변경)
      function checkAdminAccess(pageName, elmnt) {
        var input = prompt("관리자 비밀번호를 입력하세요:", "");
        if (input === null) return; // 취소 시 중단

        // 클라이언트 하드코딩 검증이 아닌 서버 검증 호출
        google.script.run
          .withSuccessHandler(function(res) {
            if (res.success) {
              openPage(pageName, elmnt);
            } else {
              alert("비밀번호가 일치하지 않습니다.");
            }
          })
          .verifyAdminPassword(input);
      }

      function tryLogin() {
        var pw = document.getElementById('login-password').value;
        google.script.run
          .withSuccessHandler(function(res) {
            if (res.success) {
              document.getElementById('login-container').style.display = 'none';
              // 로그인 성공 시 navbar를 flex로 표시 (기존 display:block은 flex 속성 무시함)
              document.getElementById('navbar').style.display = 'flex';
              // 로그인 성공 시 학년 전체 명렬표 탭 먼저 열기
              openPage('grade-section', document.querySelector('.tab-link'));
            } else {
              document.getElementById('login-msg').innerText = res.message;
            }
          })
          .verifyPassword(pw);
      }

      function saveAdminSettings() {
        var adminPw = document.getElementById('current-admin-pw').value;
        var newAccess = document.getElementById('new-access-pw').value;
        var newAdmin = document.getElementById('new-admin-pw').value;

        if (!adminPw) {
          alert('설정을 변경하려면 현재 관리자 비밀번호를 입력해야 합니다.');
          return;
        }

        google.script.run
          .withSuccessHandler(function(res) {
            alert(res.message);
            if(res.success) {
              document.getElementById('current-admin-pw').value = '';
              document.getElementById('new-access-pw').value = '';
              document.getElementById('new-admin-pw').value = '';
            }
          })
          .changePasswords(adminPw, newAccess, newAdmin);
      }
    </script>
