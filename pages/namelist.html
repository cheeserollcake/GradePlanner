    <!-- 스타일 정의 -->
    <style>
      
      
      /* [기본 레이아웃 및 탭 메뉴] */
      body { margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
      
      #navbar {
        display: none; /* 로그인 전 숨김 */
        background-color: #ffffff;
        border-bottom: 1px solid #e2e8f0;
        position: sticky;
        top: 0;
        z-index: 1000;
        padding: 0.75rem 1rem;
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        display: flex; /* Flexbox로 변경 */
        gap: 0.5rem;
        overflow-x: auto; /* 메뉴 많을 경우 스크롤 */
      }
      #navbar button {
        display: block;
        color: #334155;
        text-align: center;
        padding: 0.75rem 1.25rem;
        text-decoration: none;
        font-size: 1rem;
        font-weight: 600;
        background-color: #dbe3ff; /* 요청하신 배경색 */
        border: none;
        cursor: pointer;
        transition: all 0.2s;
        border-radius: 0.5rem; /* 버튼 둥글게 */
        white-space: nowrap;
      }
      #navbar button:hover { background-color: #c7d2fe; color: #1e293b; }
      #navbar button.active { background-color: #4f46e5; color: white; box-shadow: 0 2px 4px rgba(79, 70, 229, 0.3); }
      #navbar button.admin-btn { margin-left: auto; /* 관리자 버튼 우측 정렬 */ background-color: #f1f5f9; color: #64748b; }
      #navbar button.admin-btn.active { background-color: #475569; color: white; }
      
      /* [페이지 섹션] */
      .page-section { display: none; min-height: calc(100vh - 72px); }
      .page-section.active { display: block; }

      /* [로그인 화면] */
      #login-container {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        height: 100vh; background-color: #f1f5f9;
      }
      .login-box {
        background: white; padding: 2.5rem; border-radius: 1rem; 
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); text-align: center; width: 90%; max-width: 400px;
      }
      .login-box h2 { margin: 0 0 1rem 0; color: #1e293b; font-size: 1.5rem; }
      .login-box input { 
        padding: 0.75rem; margin: 1rem 0; width: 100%; box-sizing: border-box;
        border: 1px solid #cbd5e1; border-radius: 0.5rem; font-size: 1rem;
      }
      .login-box button { 
        width: 100%; padding: 0.75rem; background: #3b82f6; color: white; border: none; 
        cursor: pointer; font-size: 1rem; border-radius: 0.5rem; font-weight: 600;
        transition: background 0.2s;
      }
      .login-box button:hover { background: #2563eb; }

      /* [관리자 페이지] */
      .admin-container { max-width: 500px; margin: 2rem auto; padding: 2rem; background: white; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
      .form-group { margin-bottom: 1.5rem; }
      .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #475569; }
      .form-group input { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; box-sizing: border-box; }
      .btn-save { width: 100%; padding: 0.75rem; background: #0f172a; color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 600; }

      /* [앱 공통 스타일 (스크롤바, 로더 등)] */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      .loader { border: 3px solid #f3f3f3; border-top: 3px solid #6366f1; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
      .bg-male { background-color: #cfe2f3 !important; }
      .bg-female { background-color: #fce5cd !important; }
      
      @media print {
        @page { size: A4; margin: 10mm; }
        body { background: white; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .print-area { display: block !important; width: 100%; margin: 0 auto; }
        table { width: 100% !important; border-collapse: collapse !important; font-size: 11pt; }
        th, td { border: 1px solid black !important; padding: 4px !important; }
        .bg-male { background-color: #cfe2f3 !important; }
        .bg-female { background-color: #fce5cd !important; }
      }
      
      @keyframes loading-bar { 0% { width: 0%; } 50% { width: 70%; } 100% { width: 100%; } }
      .loading-progress { position: absolute; bottom: 0; left: 0; height: 3px; background-color: #3b82f6; animation: loading-bar 1s infinite; }
    </style>

  <body>

    <!-- 1. 로그인 화면 -->
    <div id="login-container">
      <div class="login-box">
        <h2>명렬표 페이지입니다.</h2>
        <p style="color:#64748b; margin-bottom:1.5rem;">비밀번호를 입력해주세요.</p>
        <input type="password" id="login-password" placeholder="비밀번호" onkeyup="if(window.event.keyCode==13){tryLogin()}">
        <button onclick="tryLogin()">입장하기</button>
        <p id="login-msg" style="color: #ef4444; font-size: 14px; margin-top: 1rem;"></p>
      </div>
    </div>

    <!-- 2. 상단 메뉴바 (초기에는 숨김, 로그인 후 JS로 display:flex 처리) -->
    <div id="navbar" style="display:none;">
      <button class="tab-link active" onclick="openPage('grade-section', this)">학년 전체 명렬표</button>
      <button class="tab-link" onclick="openPage('class-section', this)">반별 명렬표</button>
      <button class="tab-link admin-btn" onclick="checkAdminAccess('admin-section', this)">관리자</button>
    </div>

    <!-- 3. 콘텐츠 영역 -->
    
    <!-- (A) 학년 전체 명렬표 섹션 -->
    <div id="grade-section" class="page-section">
      <div id="root-grade"></div>
    </div>

    <!-- (B) 반별 명렬표 섹션 -->
    <div id="class-section" class="page-section">
      <div id="root-class"></div>
    </div>

    <!-- (C) 관리자 섹션 -->
    <div id="admin-section" class="page-section">
      <div class="admin-container">
        <h3 style="margin-top:0; font-size:1.5rem; color:#1e293b;">관리자 설정</h3>
        <!-- 요청에 따라 초기 비밀번호 텍스트 삭제함 -->
        <p style="font-size:13px; color:#64748b; margin-bottom:2rem;"></p> 
        
        <div class="form-group">
          <label>현재 관리자 비밀번호</label>
          <input type="password" id="current-admin-pw">
        </div>
        <hr style="border:0; border-top:1px solid #e2e8f0; margin: 2rem 0;">
        <div class="form-group">
          <label>새 접속 비밀번호 (명렬표 접근용)</label>
          <input type="password" id="new-access-pw" placeholder="변경하지 않으려면 비워두세요">
        </div>
        <div class="form-group">
          <label>새 관리자 비밀번호</label>
          <input type="password" id="new-admin-pw" placeholder="변경하지 않으려면 비워두세요">
        </div>
        <button class="btn-save" onclick="saveAdminSettings()">설정 저장</button>
      </div>
    </div>

    <!-- 4. 스크립트 (기능 로직 + React 코드) -->
    <script>
      // 탭 전환 및 로그인 관련 바닐라 JS 로직
      function openPage(pageName, elmnt) {
        var i, tabcontent, tablinks;
        tabcontent = document.getElementsByClassName("page-section");
        for (i = 0; i < tabcontent.length; i++) {
          tabcontent[i].style.display = "none";
          tabcontent[i].classList.remove('active');
        }
        tablinks = document.getElementsByClassName("tab-link");
        for (i = 0; i < tablinks.length; i++) {
          tablinks[i].classList.remove("active");
        }
        document.getElementById(pageName).style.display = "block";
        document.getElementById(pageName).classList.add('active');
        if(elmnt) elmnt.classList.add("active");
      }

      // 관리자 접근 체크 (서버 검증으로 변경)
      function checkAdminAccess(pageName, elmnt) {
        var input = prompt("관리자 비밀번호를 입력하세요:", "");
        if (input === null) return; // 취소 시 중단

        // 클라이언트 하드코딩 검증이 아닌 서버 검증 호출
        google.script.run
          .withSuccessHandler(function(res) {
            if (res.success) {
              openPage(pageName, elmnt);
            } else {
              alert("비밀번호가 일치하지 않습니다.");
            }
          })
          .verifyAdminPassword(input);
      }

      function tryLogin() {
        var pw = document.getElementById('login-password').value;
        google.script.run
          .withSuccessHandler(function(res) {
            if (res.success) {
              document.getElementById('login-container').style.display = 'none';
              // 로그인 성공 시 navbar를 flex로 표시 (기존 display:block은 flex 속성 무시함)
              document.getElementById('navbar').style.display = 'flex';
              // 로그인 성공 시 학년 전체 명렬표 탭 먼저 열기
              openPage('grade-section', document.querySelector('.tab-link'));
            } else {
              document.getElementById('login-msg').innerText = res.message;
            }
          })
          .verifyPassword(pw);
      }

      function saveAdminSettings() {
        var adminPw = document.getElementById('current-admin-pw').value;
        var newAccess = document.getElementById('new-access-pw').value;
        var newAdmin = document.getElementById('new-admin-pw').value;

        if (!adminPw) {
          alert('설정을 변경하려면 현재 관리자 비밀번호를 입력해야 합니다.');
          return;
        }

        google.script.run
          .withSuccessHandler(function(res) {
            alert(res.message);
            if(res.success) {
              document.getElementById('current-admin-pw').value = '';
              document.getElementById('new-access-pw').value = '';
              document.getElementById('new-admin-pw').value = '';
            }
          })
          .changePasswords(adminPw, newAccess, newAdmin);
      }
    </script>
