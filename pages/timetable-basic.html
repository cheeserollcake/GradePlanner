      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

      .loader {
        border: 3px solid #f3f3f3; border-top: 3px solid #6366f1;
        border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      
      /* 하이라이트 색상 */

      .bg-p13 { background-color: #ecf1fe !important; font-weight: bold; }
      
      @keyframes loading-bar {
        0% { width: 0%; }
        50% { width: 70%; }
        100% { width: 100%; }
      }
      .loading-progress {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 3px;
        background-color: #3b82f6;
        animation: loading-bar 1s infinite;
      }

      /* 드롭다운 가운데 정렬을 위한 스타일 */
      select.center-select {
        text-align: center;
        text-align-last: center;
        -moz-text-align-last: center;
      }
