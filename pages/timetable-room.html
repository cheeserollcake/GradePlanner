    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; background-color: #f8fafc; color: #1e293b; }
    
    .loading-indicator { position: fixed; bottom: 20px; right: 20px; background: rgba(255,255,255,0.95); padding: 12px 24px; border-radius: 50px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 12px; z-index: 9999; font-size: 14px; font-weight: bold; color: #4f46e5; border: 1px solid #e2e8f0; animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .spinner { width: 18px; height: 18px; border: 3px solid #e2e8f0; border-top-color: #4f46e5; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; display: flex; justify-content: center; align-items: center; overflow: auto; padding: 20px; }
    .image-modal-content { max-width: none; max-height: none; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); margin: auto; }
    
    .bg-auditorium { background-color: #cfe2f3; }
    .bg-multi { background-color: #fce5cd; }
    .bg-play { background-color: #d9ead3; }
    .bg-narae { background-color: #FFFEB5; }
    .bg-vr { background-color: #e4d7f5; }
    .bg-holiday { background-color: #fce8e6 !important; }
    .text-holiday { color: #dc2626; font-weight: 800; }
    
    .cell-select { width: 100%; height: 100%; background: transparent; text-align: center; font-size: 11pt; border: none; outline: none; cursor: pointer; padding: 0; appearance: none; -webkit-appearance: none; font-weight: 600; line-height: 1; }
    .cell-select:focus { background-color: rgba(255,255,255,0.9); box-shadow: inset 0 0 0 1px #4f46e5; }
    
    .cell-multi-text { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 11pt; font-weight: 600; cursor: pointer; text-align: center; padding: 0 2px; line-height: 1.1; white-space: normal; word-break: keep-all; }
    .cell-multi-text:hover { background-color: rgba(255,255,255,0.4); }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    .scroll-container { flex: 1; overflow-x: auto; overflow-y: auto; padding: 1rem; display: block; text-align: center; }
    .table-wrapper { display: inline-table; text-align: left; }

    .td-sports { width: 320px; min-width: 320px; max-width: 320px; }
    .table-fixed-sports { width: 310px; min-width: 310px; max-width: 310px; }
    .grid-row-sports { display: grid; grid-template-columns: repeat(6, 1fr); width: 100%; }
    
    .td-com { width: 220px; min-width: 220px; max-width: 220px; }
    .table-fixed-com { width: 210px; min-width: 210px; max-width: 210px; }
    .grid-row-com { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; }

    .grid-col { overflow: hidden; white-space: nowrap; display: flex; align-items: center; justify-content: center; padding: 0; line-height: 1.2; height: 100%; }
    
    th.sticky-header-sports { position: sticky; top: 0; z-index: 20; background-color: #f1f5f9; box-shadow: 0 1px 2px rgba(0,0,0,0.1); width: 320px; min-width: 320px; }
    th.sticky-header-com { position: sticky; top: 0; z-index: 20; background-color: #f1f5f9; box-shadow: 0 1px 2px rgba(0,0,0,0.1); width: 220px; min-width: 220px; }
  .scroll-container { overflow-x: auto; }
    .scroll-container > table { display: table !important; width: 100% !important; min-width: 760px; }
    td.td-sports, td.td-com, th.sticky-header-sports, th.sticky-header-com { width: 20% !important; min-width: 0 !important; max-width: none !important; }
    .table-fixed-sports, .table-fixed-com { width: 100% !important; min-width: 0 !important; max-width: none !important; }
    /* 화면이 좁아지면 글자도 줄이되(최소 8pt) 셀 밖으로 삐져나가지 않게, 1열(교시)은 줄바꿈 */
    .grid-col, .grid-col * { font-size: clamp(10.67px, calc(7.2px + 0.58vw), 14.67px) !important; min-width: 0; }
    .grid-col { white-space: normal !important; overflow: hidden; text-overflow: clip; word-break: break-all; overflow-wrap: anywhere; line-height: 1.05 !important; text-align: center; }
    .grid-col > div, .grid-col select, .grid-col input { max-width: 100%; }
    .grid-col:first-child { word-break: keep-all; }
