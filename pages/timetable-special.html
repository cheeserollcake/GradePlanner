<!DOCTYPE html>
<html>
  <head>
  <script>window.__GP_PAGE__ = 'p06';</script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/gas-shim.js"></script>

    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.3/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
      body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }

      /* 로딩바 */
      .loader-container {
        position: fixed; top: 0; left: 0; width: 100%; height: 4px; z-index: 100;
        background-color: #e2e8f0; overflow: hidden;
      }
      .progress-bar {
        height: 100%; background-color: #4f46e5;
        animation: progress 2s infinite ease-in-out;
        width: 0%;
      }
      @keyframes progress {
        0% { width: 0%; left: 0; }
        50% { width: 70%; left: 30%; }
        100% { width: 100%; left: 100%; }
      }
      
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      
      table { border-collapse: separate; border-spacing: 0; }
      th, td { 
        border-right: 1px solid #e2e8f0; 
        border-bottom: 1px solid #e2e8f0; 
        padding: 0; 
        text-align: center; 
      }
      th { border-top: 1px solid #e2e8f0; border-left: 1px solid #e2e8f0; padding: 4px; }
      td { border-left: 1px solid #e2e8f0; }

      /* Sticky Positioning */
      .sticky-col-1 { position: sticky; left: 0; z-index: 20; }
      .sticky-col-2 { position: sticky; left: 40px; z-index: 20; }
      
      .sticky-header-1 { position: sticky; top: 0; z-index: 30; }
      .sticky-header-2 { position: sticky; top: 30px; z-index: 30; }
      .sticky-header-3 { position: sticky; top: 60px; z-index: 30; }

      .sticky-corner { z-index: 40 !important; }

      /* 조건부 서식 색상 */
      .bg-color-0 { background-color: #f4cccc !important; }
      .bg-color-1 { background-color: #ea9999 !important; }
      .bg-color-2 { background-color: #fff2cc !important; }
      .bg-color-3 { background-color: #ffe599 !important; }
      .bg-color-4 { background-color: #d9ead3 !important; }
      .bg-color-5 { background-color: #b6d7a8 !important; }
      .bg-color-6 { background-color: #c9daf8 !important; }
      .bg-color-7 { background-color: #a4c2f4 !important; }
      .bg-color-8 { background-color: #d9d2e9 !important; }
      .bg-color-9 { background-color: #988bb9 !important; }

      .text-bold-red { font-weight: bold; color: red; }
      
      /* 셀 크기 55px */
      .cell-fixed {
        width: 55px;
        min-width: 55px;
        max-width: 55px;
        height: 30px;
        font-size: 9pt;
      }

      /* 시수편차 테이블: 고정 레이아웃 제거하여 내용에 맞게 조절 */
      .table-auto-layout {
        table-layout: auto;
        width: 100%;
      }

      /* 시간표 테이블: 고정 레이아웃 유지 */
      .table-fixed-layout {
        table-layout: fixed;
        width: 100%;
      }
      
      .cell-input {
        width: 55px; height: 30px; 
        text-align: center; border: 2px solid #4f46e5; outline: none;
        font-size: 9pt; font-weight: bold; background: white;
      }
      
      /* 저장 상태 표시 스타일 */
      .save-btn {
        display: flex; align-items: center; gap: 6px;
        background-color: #4f46e5; color: white;
        padding: 6px 16px; border-radius: 9999px;
        font-size: 0.85rem; font-weight: bold;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        transition: all 0.2s;
      }
      .save-btn:hover { background-color: #4338ca; transform: translateY(-1px); }
      .save-btn:active { transform: translateY(0); }
      
      .status-saved { color: #10b981; display: flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 500;} 
      .status-saving { color: #f59e0b; display: flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: bold; }
      
      .spin-icon { animation: spin 1s linear infinite; }
      @keyframes spin { 100% { transform: rotate(360deg); } }

      .unsaved-dot {
        width: 8px; height: 8px; background-color: #ef4444; border-radius: 50%;
        animation: pulse 2s infinite;
      }
      @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
    <!-- [속도 최적화] 서버에서 주입된 데이터 -->
    <script>
      // Code.gs에서 주입된 initialData를 전역 변수로 할당
      // 데이터가 없으면 null 처리
      window.SERVER_DATA_RAW = null;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      const IconCheck = () => (
        <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
        </svg>
      );
      
      const IconSync = () => (
        <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 spin-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      );
      
      const IconSave = () => (
        <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
           <path strokeLinecap="round" strokeLinejoin="round" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
        </svg>
      );

      const SpecialTimetableApp = () => {
        const [activeTab, setActiveTab] = useState('');
        const [semester, setSemester] = useState(1);
        
        const [cachedData, setCachedData] = useState({});
        const [loading, setLoading] = useState(false);
        const [initialLoaded, setInitialLoaded] = useState(false);
        
        // 'saved' | 'unsaved' | 'saving' | 'error'
        const [saveStatus, setSaveStatus] = useState('saved');
        
        const saveQueue = useRef([]);         
        const isProcessing = useRef(false);
        
        const [editingCell, setEditingCell] = useState(null);

        const tabs = Object.keys(cachedData);

        useEffect(() => {
          const now = new Date();
          const month = now.getMonth() + 1; 
          if (month >= 2 && month <= 7) setSemester(1);
          else setSemester(2);
          
          // [속도 최적화] 서버에서 주입된 데이터가 있으면 바로 사용
          if (window.SERVER_DATA_RAW && window.SERVER_DATA_RAW.success) {
            applyData(window.SERVER_DATA_RAW);
          } else {
            // 실패했거나 없으면 fetch 시도 (폴백)
            fetchAllData();
          }
        }, []);

        useEffect(() => {
          const handleBeforeUnload = (e) => {
            if (saveStatus === 'unsaved' || saveStatus === 'saving' || saveQueue.current.length > 0) {
              e.preventDefault();
              e.returnValue = '저장되지 않은 변경사항이 있습니다.';
              return e.returnValue;
            }
          };
          window.addEventListener('beforeunload', handleBeforeUnload);
          return () => window.removeEventListener('beforeunload', handleBeforeUnload);
        }, [saveStatus]);

        const applyData = (parsed) => {
            const processedAll = {};
            Object.keys(parsed.data).forEach(key => {
              processedAll[key] = processDataOnLoad(parsed.data[key]);
            });
            setCachedData(processedAll);
            setActiveTab(prev => (prev && processedAll[prev]) ? prev : (Object.keys(processedAll)[0] || ''));
            if (parsed.currentSemester) setSemester(parsed.currentSemester);
            setInitialLoaded(true);
        };

        const fetchAllData = () => {
          setLoading(true);
          google.script.run
            .withSuccessHandler(res => {
              const parsed = JSON.parse(res);
              if (parsed.success) {
                applyData(parsed);
              }
              else alert('로드 실패: ' + parsed.error);
              setLoading(false);
            })
            .withFailureHandler(err => {
              alert('서버 오류: ' + err);
              setLoading(false);
            })
            .getAllTimetableData();
        };

        const processDataOnLoad = (rawData) => {
          const newData = { ...rawData };
          newData.sem1 = recalculateTopTable(newData.sem1);
          newData.sem2 = recalculateTopTable(newData.sem2);
          return newData;
        };

        useEffect(() => {
          setEditingCell(null);
        }, [activeTab]);

        const recalculateTopTable = (semData) => {
          const { top, bottom, options } = semData;
          const counts = {};
          options.forEach(opt => { if(opt) counts[opt] = 0; });

          bottom.forEach(row => {
            row.forEach((cell, cIdx) => {
              if (cIdx > 1 && cell && counts.hasOwnProperty(cell)) {
                counts[cell]++;
              }
            });
          });

          const newTop = top.map(row => [...row]);
          if (newTop.length < 3) {
            newTop.push(new Array(newTop[0].length).fill(''));
          }
          if (newTop[2]) {
             newTop[2][0] = '배정';
             for (let i = 1; i < newTop[0].length; i++) {
               const headerName = newTop[0][i];
               const count = counts[headerName] || 0;
               newTop[2][i] = count;
             }
          }
          return { ...semData, top: newTop };
        };

        const executeBatchSave = () => {
          if (saveQueue.current.length === 0) {
            setSaveStatus('saved');
            return;
          }

          isProcessing.current = true;
          setSaveStatus('saving');

          const batchItems = [...saveQueue.current];
          saveQueue.current = [];

          google.script.run
            .withSuccessHandler(() => {
              if (saveQueue.current.length === 0) {
                isProcessing.current = false;
                setSaveStatus('saved');
              } else {
                isProcessing.current = false;
                setSaveStatus('unsaved');
              }
            })
            .withFailureHandler((err) => {
              console.error("Batch Save Error:", err);
              saveQueue.current = [...batchItems, ...saveQueue.current];
              setSaveStatus('error');
              isProcessing.current = false;
              alert("저장 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.\n" + err);
            })
            .updateBatchSpecialTimetable(batchItems);
        };

        const handleUpdate = (r, c, value) => {
          if (!cachedData[activeTab]) return;

          const semKey = semester === 1 ? 'sem1' : 'sem2';
          const currentTabData = { ...cachedData[activeTab] };
          const currentSemData = { ...currentTabData[semKey] };
          
          const newBottom = [...currentSemData.bottom];
          newBottom[r] = [...newBottom[r]];
          newBottom[r][c] = value;
          currentSemData.bottom = newBottom;

          const recalculatedSemData = recalculateTopTable(currentSemData);
          currentTabData[semKey] = recalculatedSemData;

          setCachedData(prev => ({
            ...prev,
            [activeTab]: currentTabData
          }));

          const existingIndex = saveQueue.current.findIndex(
            item => item.sheetName === activeTab && item.semester === semester && item.r === r && item.c === c
          );
          const newItem = {
            sheetName: activeTab,
            semester: semester,
            r: r,
            c: c,
            value: value
          };

          if (existingIndex !== -1) {
            saveQueue.current[existingIndex] = newItem;
          } else {
            saveQueue.current.push(newItem);
          }

          setSaveStatus('unsaved');
        };

        const handleDirectInputCommit = (r, c, e) => {
          const newVal = e.target.value;
          handleUpdate(r, c, newVal);
          setEditingCell(null);
        };

        const getColorClass = (val, options) => {
          if (!val) return '';
          const idx = options.indexOf(val);
          if (idx >= 0) return `bg-color-${idx % 10}`;
          return '';
        };

        const getTextStyle = (val) => {
          if (typeof val === 'string' && val.length <= 2) return 'text-bold-red';
          return '';
        };

        const currentTabData = cachedData[activeTab];
        let top, bottom, options, title, validOptions;
        if (currentTabData) {
          const currentSemData = semester === 1 ? currentTabData.sem1 : currentTabData.sem2;
          ({ top, bottom, options, title } = currentSemData);
          validOptions = options.filter(opt => opt && opt !== '');
        }

        const weekDays = ['월', '화', '수', '목', '금'];

        return (
          <div className="flex flex-col h-screen overflow-hidden font-sans text-slate-800 bg-slate-50">
            {loading && (
              <div className="loader-container">
                <div className="progress-bar"></div>
              </div>
            )}

            <header className="bg-white border-b border-slate-200 shadow-sm z-50 shrink-0">
              <div className="p-4 flex items-center justify-between">
                <div className="flex items-center gap-4">
                  <h1 className="text-xl font-bold text-indigo-700">전담 시간표</h1>
                  
                  <div className="ml-4">
                    {saveStatus === 'unsaved' && (
                      <button onClick={executeBatchSave} className="save-btn animate-bounce-short">
                        <div className="unsaved-dot"></div>
                        <span>저장하기 ({saveQueue.current.length})</span>
                      </button>
                    )}
                    {saveStatus === 'saving' && (
                      <span className="status-saving">
                        <IconSync/> 저장 중...
                      </span>
                    )}
                    {saveStatus === 'saved' && (
                      <span className="status-saved">
                        <IconCheck/> 모든 내용 저장됨
                      </span>
                    )}
                     {saveStatus === 'error' && (
                      <button onClick={executeBatchSave} className="save-btn bg-red-500 hover:bg-red-600">
                        <IconSync/> 재시도
                      </button>
                    )}
                  </div>
                </div>

                <div className="flex gap-2">
                  <button onClick={() => setSemester(1)} className={`px-4 py-1.5 rounded-full text-sm font-bold transition ${semester===1 ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}`}>1학기</button>
                  <button onClick={() => setSemester(2)} className={`px-4 py-1.5 rounded-full text-sm font-bold transition ${semester===2 ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}`}>2학기</button>
                </div>
              </div>
              <div className="flex overflow-x-auto px-4 pb-0 space-x-1">
                {tabs.map(tab => (
                  <button key={tab} onClick={() => setActiveTab(tab)} className={`px-4 py-3 border-b-2 text-sm font-medium whitespace-nowrap ${activeTab === tab ? 'border-indigo-600 text-indigo-700' : 'border-transparent text-slate-500 hover:text-slate-700'}`}>
                    {tab}
                  </button>
                ))}
              </div>
            </header>

            <main className="flex-1 overflow-y-auto p-4 lg:p-6 space-y-6">
              {initialLoaded && tabs.length === 0 ? (
                <div className="flex flex-col items-center justify-center h-64 text-slate-400 space-y-2"><p>등록된 전담교사가 없습니다.</p><p className="text-sm">학년 관리자 &gt; 학년 기초 설정 &gt; 전담교사에서 과목·담당학급·교사를 등록하세요.</p></div>
              ) : !initialLoaded || !currentTabData ? (
                <div className="flex flex-col items-center justify-center h-64 text-slate-400 space-y-4">
                  <p>모든 시간표 데이터를 불러오는 중입니다...</p>
                  <p className="text-sm text-slate-300">잠시만 기다려주세요</p>
                </div>
              ) : (
                <>
                  <section className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div className="p-3 bg-indigo-50 border-b border-indigo-100 font-bold text-indigo-900">
                      {semester}학기 시수 편차
                    </div>
                    <div className="overflow-x-auto p-4">
                      <table className="table-auto-layout border-collapse">
                        <thead>
                          <tr>
                            <th colSpan={top[0].length} className="bg-slate-50 p-2 font-bold text-lg border">{title}</th>
                          </tr>
                        </thead>
                        <tbody>
                          {top.map((row, rIdx) => (
                            <tr key={rIdx}>
                              {row.map((cell, cIdx) => {
                                let cellClass = "border p-2 whitespace-nowrap ";
                                if (cIdx === 0) cellClass += "bg-slate-50 font-bold ";
                                if (rIdx === 0 && cIdx > 0) {
                                  cellClass += getColorClass(cell, options) + " ";
                                }
                                if (rIdx === 2 && cIdx > 0) {
                                  const targetVal = parseFloat(top[1][cIdx]) || 0;
                                  const currentVal = parseFloat(cell) || 0;
                                  if (targetVal && targetVal !== currentVal) {
                                    cellClass += "font-bold text-red-600 ";
                                  } else {
                                    cellClass += "text-gray-900 ";
                                  }
                                }
                                return <td key={cIdx} className={cellClass}>{cell}</td>;
                              })}
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </section>

                  <section className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-[600px]">
                    <div className="p-3 bg-indigo-50 border-b border-indigo-100 font-bold text-indigo-900 shrink-0">
                      {semester}학기 {activeTab} 시간표
                    </div>
                    
                    <div className="overflow-auto flex-1 relative">
                      <table className="border-collapse" style={{ tableLayout: 'fixed', minWidth: 'max-content' }}>
                        <thead className="bg-white">
                          <tr style={{ height: '30px' }}>
                            <th colSpan="32" className="sticky-header-1 border p-2 bg-slate-100 font-bold text-lg z-30">
                              {title}
                            </th>
                          </tr>
                          <tr style={{ height: '30px' }}>
                            <th className="sticky-col-1 sticky-header-2 sticky-corner bg-slate-50 border p-1 z-40" colSpan="2" style={{width: '120px'}}></th>
                            {weekDays.map(day => (
                              <th key={day} colSpan="6" className="sticky-header-2 border p-1 bg-slate-100 font-bold text-base">{day}</th>
                            ))}
                          </tr>
                          <tr className="bg-slate-50 font-bold" style={{ height: '30px' }}>
                            <th className="sticky-col-1 sticky-header-3 sticky-corner border p-1 bg-slate-50" style={{width: '40px', left:0}}>주</th>
                            <th className="sticky-col-2 sticky-header-3 sticky-corner border p-1 bg-slate-50" style={{width: '80px', left:'40px'}}>기간</th>
                            {weekDays.map(d => (
                              Array.from({length: 6}, (_, i) => i + 1).map(num => (
                                <th key={`${d}-${num}`} className="sticky-header-3 border p-1 bg-slate-50 cell-fixed">{num}</th>
                              ))
                            ))}
                          </tr>
                        </thead>
                        <tbody>
                          {bottom.map((row, rIdx) => (
                            <tr key={rIdx} className="hover:bg-slate-50">
                              {row.map((cell, cIdx) => {
                                if (cIdx === 0) return <td key={cIdx} className="sticky-col-1 border p-1 bg-slate-50 font-bold text-center text-xs" style={{width:'40px', left:0}}>{cell}</td>;
                                if (cIdx === 1) return <td key={cIdx} className="sticky-col-2 border p-1 bg-slate-50 font-medium text-xs text-center" style={{width:'80px', left:'40px'}}>{cell}</td>;

                                const colorClass = getColorClass(cell, options);
                                const textClass = getTextStyle(cell);
                                const isEditing = editingCell?.r === rIdx && editingCell?.c === cIdx;

                                return (
                                  <td key={cIdx} className={`border p-0 ${!isEditing ? colorClass : ''} ${!isEditing ? textClass : ''}`}>
                                    {isEditing ? (
                                      <input 
                                        type="text"
                                        className="cell-input"
                                        defaultValue={cell}
                                        maxLength={1}
                                        autoFocus
                                        onBlur={(e) => handleDirectInputCommit(rIdx, cIdx, e)}
                                        onKeyDown={(e) => {
                                          if (e.key === 'Enter') handleDirectInputCommit(rIdx, cIdx, e);
                                        }}
                                      />
                                    ) : (
                                      <select 
                                        className="cell-fixed bg-transparent outline-none text-center appearance-none cursor-pointer"
                                        value={cell || ''}
                                        onChange={(e) => {
                                          if (e.target.value === 'direct_input') {
                                            setEditingCell({r: rIdx, c: cIdx});
                                          } else {
                                            handleUpdate(rIdx, cIdx, e.target.value);
                                          }
                                        }}
                                      >
                                        <option value=""></option>
                                        {validOptions.map((opt, i) => (
                                          <option key={i} value={opt}>{opt}</option>
                                        ))}
                                        {!validOptions.includes(cell) && cell && <option value={cell}>{cell}</option>}
                                        
                                      </select>
                                    )}
                                  </td>
                                );
                              })}
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </section>
                </>
              )}
            </main>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<SpecialTimetableApp />);
    </script>
  </body>
</html>
