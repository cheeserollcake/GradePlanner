    <style>
      
      body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; background-color: #f8fafc; }

      /* 로딩바 */
      .loader-container {
        position: fixed; top: 0; left: 0; width: 100%; height: 4px; z-index: 100;
        background-color: #e2e8f0; overflow: hidden;
      }
      .progress-bar {
        height: 100%; background-color: #4f46e5;
        animation: progress 2s infinite ease-in-out;
        width: 0%;
      }
      @keyframes progress {
        0% { width: 0%; left: 0; }
        50% { width: 70%; left: 30%; }
        100% { width: 100%; left: 100%; }
      }
      
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      
      table { border-collapse: separate; border-spacing: 0; }
      th, td { 
        border-right: 1px solid #e2e8f0; 
        border-bottom: 1px solid #e2e8f0; 
        padding: 0; 
        text-align: center; 
      }
      th { border-top: 1px solid #e2e8f0; border-left: 1px solid #e2e8f0; padding: 4px; }
      td { border-left: 1px solid #e2e8f0; }

      /* Sticky Positioning */
      .sticky-col-1 { position: sticky; left: 0; z-index: 20; }
      .sticky-col-2 { position: sticky; left: 40px; z-index: 20; }
      
      .sticky-header-1 { position: sticky; top: 0; z-index: 30; }
      .sticky-header-2 { position: sticky; top: 30px; z-index: 30; }
      .sticky-header-3 { position: sticky; top: 60px; z-index: 30; }

      .sticky-corner { z-index: 40 !important; }

      /* 조건부 서식 색상 */
      .bg-color-0 { background-color: #f4cccc !important; }
      .bg-color-1 { background-color: #ea9999 !important; }
      .bg-color-2 { background-color: #fff2cc !important; }
      .bg-color-3 { background-color: #ffe599 !important; }
      .bg-color-4 { background-color: #d9ead3 !important; }
      .bg-color-5 { background-color: #b6d7a8 !important; }
      .bg-color-6 { background-color: #c9daf8 !important; }
      .bg-color-7 { background-color: #a4c2f4 !important; }
      .bg-color-8 { background-color: #d9d2e9 !important; }
      .bg-color-9 { background-color: #988bb9 !important; }

      .text-bold-red { font-weight: bold; color: red; }
      .text-bold-black { font-weight: bold; color: #000; }
      
      /* 셀 크기 55px */
      th.sticky-header-3.cell-fixed { font-size: 10pt !important; line-height: 1.1; font-weight: 700; padding: 4px 1px; }   /* 교시 머리글 10pt */
      .cell-fixed {
        width: 100%;
        min-width: 0;
        max-width: none;
        height: 30px;
        font-size: 13pt;
      }

      /* 시수편차 테이블: 고정 레이아웃 제거하여 내용에 맞게 조절 */
      .table-auto-layout {
        table-layout: auto;
        width: 100%;
      }

      /* 시간표 테이블: 고정 레이아웃 유지 */
      .table-fixed-layout {
        table-layout: fixed;
        width: 100%;
      }
      
      .cell-input {
        width: 100%; height: 30px;
        text-align: center; border: 2px solid #4f46e5; outline: none;
        font-size: 13pt; font-weight: bold; background: white;
      }
      
      /* 저장 상태 표시 스타일 */
      .save-btn {
        display: flex; align-items: center; gap: 6px;
        background-color: #4f46e5; color: white;
        padding: 6px 16px; border-radius: 9999px;
        font-size: 0.85rem; font-weight: bold;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        transition: all 0.2s;
      }
      .save-btn:hover { background-color: #4338ca; transform: translateY(-1px); }
      .save-btn:active { transform: translateY(0); }
      
      .status-saved { color: #10b981; display: flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 500;} 
      .status-saving { color: #f59e0b; display: flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: bold; }
      
      .spin-icon { animation: spin 1s linear infinite; }
      @keyframes spin { 100% { transform: rotate(360deg); } }

      .unsaved-dot {
        width: 8px; height: 8px; background-color: #ef4444; border-radius: 50%;
        animation: pulse 2s infinite;
      }
      @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
