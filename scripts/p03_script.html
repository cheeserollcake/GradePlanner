<script src="../assets/js/xlsx-lite.js"></script>
    <script>
      (function () {
        const $ = (id) => document.getElementById(id);
        const GENDER = { '남성': 'male', '여성': 'female' };
        const LABEL = { no: '번호', name: '이름', gender: '성별', note: '기타', birth: '생년월일' }, IDX = { no: 0, name: 1, gender: 2, note: 3, birth: 4 };
        const WIDTH = { no: 6, name: 11, gender: 7, note: 16, birth: 14, chk: 7 };
        let CC = 10;   // 학급 수 (관리자 설정)
        const call = (name, ...args) => new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[name](...args));
        // 상단 메뉴 높이만큼 아래에 반 버튼줄을 고정
        const navH = () => { const n = $('navbar'); if (n) document.documentElement.style.setProperty('--nav-h', n.offsetHeight + 'px'); };
        window.addEventListener('resize', navH); setInterval(navH, 1500);
        async function loadCount() {
          try { const r = JSON.parse(await call('getGradeData')); CC = (r.horizontal && r.horizontal.classCount) || 10; } catch (e) { /* 기본값 */ }
          $('xl-class').innerHTML = Array.from({ length: CC }, (_, i) => '<option value="' + (i + 1) + '">' + (i + 1) + '반</option>').join('') + '<option value="all">전체 반 (반마다 시트)</option>';
        }
        $('xl-class').innerHTML = '<option value="1">1반</option>'; loadCount();
        const open = () => { loadCount(); $('xl-modal').style.display = 'flex'; }, close = () => { $('xl-modal').style.display = 'none'; };
        $('xl-open').onclick = open; $('xl-cancel').onclick = close;
        $('xl-modal').addEventListener('mousedown', (e) => { if (e.target === $('xl-modal')) close(); });
        const chk = $('xl-checks'); const setChk = (v) => { chk.value = Math.max(0, Math.min(30, Math.round(Number(v) || 0))); };
        $('xl-minus').onclick = () => setChk(Number(chk.value) - 1); $('xl-plus').onclick = () => setChk(Number(chk.value) + 1); chk.onchange = () => setChk(chk.value);
        document.querySelectorAll('input[name=xl-scope]').forEach((r) => r.onchange = () => { $('xl-class').disabled = document.querySelector('input[name=xl-scope]:checked').value !== 'class'; });
        $('xl-class').disabled = true;
        const save = (sheets, file) => {
          const a = document.createElement('a'); a.href = URL.createObjectURL(XlsxLite.toBlob(sheets)); a.download = file + '.xlsx';
          document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
        };
        const getClass = async (n) => { const r = JSON.parse(await call('getClassData', n)); if (!r.success) throw new Error(r.error); return r.data.slice(1); };
        const cell = (v, s) => ({ v, s });
        function rowCells(r, fields, nChk) {   // 한 학생(행)의 선택 항목 + 체크리스트 칸. 남/여 색은 줄 전체에 적용
          const st = GENDER[r[2]] || 'center'; const out = fields.map((f) => cell(f === 'no' ? Number(r[0]) : String(r[IDX[f]] == null ? '' : r[IDX[f]]), st));
          for (let i = 0; i < nChk; i++) out.push(cell('', st)); return out;
        }
        const headers = (fields, nChk) => fields.map((f) => cell(LABEL[f], 'totalLabel')).concat(Array.from({ length: nChk }, (_, i) => cell('체크' + (i + 1), 'totalLabel')));
        const widths = (fields, nChk) => fields.map((f) => WIDTH[f]).concat(Array.from({ length: nChk }, () => WIDTH.chk));
        function classSheet(n, rows, fields, nChk) {
          return { name: n + '반', widths: widths(fields, nChk), freezeRow: 2, rows: [[cell(n + '반 명렬표', 'title')], headers(fields, nChk)].concat(rows.map((r) => rowCells(r, fields, nChk))) };
        }
        function gradeSheet(all, fields, nChk) {   // 5개 반씩 가로로 나란히 (웹 화면과 같은 배치)
          const w = fields.length + nChk, rows = [], merges = [], wd = [];
          for (let c = 0; c < 5; c++) wd.push(...widths(fields, nChk), 2);
          const ref = (r, c) => XlsxLite.colName(c) + (r + 1);
          for (let start = 1, gi = 0; start <= CC; start += 5, gi++) {
            const per = Math.min(5, CC - start + 1);
            const top = rows.length, r1 = [], r2 = [], r3 = [];
            for (let c = 0; c < per; c++) {
              const data = all[start + c - 1] || []; let m = 0, f = 0; data.forEach((r) => { if (String(r[1]).trim()) { if (r[2] === '남성') m++; if (r[2] === '여성') f++; } });
              const fill = (t, s) => Array.from({ length: w }, (_, i) => cell(i === 0 ? t : '', s));
              r1.push(...fill((start + c) + '반', 'totalLabel'), cell('', 'default')); r2.push(...fill('재적: ' + (m + f) + ' (남' + m + '/여' + f + ')', 'totalLabel'), cell('', 'default')); r3.push(...headers(fields, nChk), cell('', 'default'));
              const base = c * (w + 1); if (w > 1) merges.push(ref(top, base) + ':' + ref(top, base + w - 1), ref(top + 1, base) + ':' + ref(top + 1, base + w - 1));
            }
            rows.push(r1, r2, r3);
            for (let i = 0; i < 30; i++) { const line = []; for (let c = 0; c < per; c++) { const d = (all[start + c - 1] || [])[i] || [i + 1, '', '', '', '']; line.push(...rowCells(d, fields, nChk), cell('', 'default')); } rows.push(line); }
            rows.push([]);
          }
          return { name: '학년 전체 명렬표', widths: wd, rows, merges };
        }
        $('xl-go').onclick = async () => {
          const fields = [...document.querySelectorAll('.xl-f:checked')].map((x) => x.value), nChk = Number(chk.value) || 0;
          if (!fields.length && !nChk) return alert('내려받을 항목을 하나 이상 선택하세요.');
          const scope = document.querySelector('input[name=xl-scope]:checked').value; const btn = $('xl-go'); btn.disabled = true; btn.textContent = '만드는 중…';
          try {
            if (scope === 'grade') {
              const all = []; for (let n = 1; n <= CC; n++) all.push(await getClass(n));
              save([gradeSheet(all, fields, nChk)], '학년_전체_명렬표');
            } else if ($('xl-class').value === 'all') {
              const sheets = []; for (let n = 1; n <= CC; n++) { const d = await getClass(n); if (d.some((r) => String(r[1]).trim())) sheets.push(classSheet(n, d, fields, nChk)); }
              if (!sheets.length) throw new Error('명단이 입력된 반이 없습니다.'); save(sheets, '반별_명렬표_전체');
            } else { const n = Number($('xl-class').value); save([classSheet(n, await getClass(n), fields, nChk)], n + '반_명렬표'); }
            close();
          } catch (e) { alert('엑셀을 만들지 못했습니다: ' + (e.message || e)); }
          btn.disabled = false; btn.textContent = '내려받기';
        };

        // ------------------------------------------------------------ 업로드 (xlsx 읽기)
        const u16 = (d, o) => d[o] | (d[o + 1] << 8), u32 = (d, o) => (d[o] | (d[o + 1] << 8) | (d[o + 2] << 16) | (d[o + 3] << 24)) >>> 0;
        async function unzip(buf) {
          const d = new Uint8Array(buf); let e = d.length - 22; while (e >= 0 && u32(d, e) !== 0x06054b50) e--;
          if (e < 0) throw new Error('엑셀(.xlsx) 파일이 아닙니다.');
          const n = u16(d, e + 10); let p = u32(d, e + 16); const files = {};
          for (let i = 0; i < n; i++) {
            if (u32(d, p) !== 0x02014b50) break;
            const method = u16(d, p + 10), csize = u32(d, p + 20), nl = u16(d, p + 28), el = u16(d, p + 30), cl = u16(d, p + 32), off = u32(d, p + 42);
            const name = new TextDecoder().decode(d.subarray(p + 46, p + 46 + nl)); p += 46 + nl + el + cl;
            const start = off + 30 + u16(d, off + 26) + u16(d, off + 28); const raw = d.subarray(start, start + csize);
            files[name] = { method, raw };
          }
          const get = async (name) => {
            const f = files[name]; if (!f) return null;
            if (f.method === 0) return new TextDecoder().decode(f.raw);
            const ds = new DecompressionStream('deflate-raw'); const w = ds.writable.getWriter(); w.write(f.raw); w.close();
            return new TextDecoder().decode(await new Response(ds.readable).arrayBuffer());
          };
          return { get, names: Object.keys(files) };
        }
        const xml = (t) => new DOMParser().parseFromString(t, 'application/xml');
        const colIdx = (ref) => { let n = 0; for (const ch of ref.replace(/[0-9]/g, '')) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };
        async function readXlsx(buf) {
          const z = await unzip(buf);
          const wb = xml(await z.get('xl/workbook.xml')), rels = xml(await z.get('xl/_rels/workbook.xml.rels'));
          const relMap = {}; [...rels.getElementsByTagName('Relationship')].forEach((r) => { relMap[r.getAttribute('Id')] = r.getAttribute('Target'); });
          let shared = []; const ss = await z.get('xl/sharedStrings.xml');
          if (ss) shared = [...xml(ss).getElementsByTagName('si')].map((si) => [...si.getElementsByTagName('t')].map((t) => t.textContent).join(''));
          const sheets = [];
          for (const s of [...wb.getElementsByTagName('sheet')]) {
            const rid = s.getAttribute('r:id') || s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
            let target = relMap[rid] || ''; target = target.replace(/^\//, ''); if (!/^xl\//.test(target)) target = 'xl/' + target;
            const txt = await z.get(target); if (!txt) continue;
            const rows = [];
            [...xml(txt).getElementsByTagName('row')].forEach((row) => {
              const r = []; [...row.getElementsByTagName('c')].forEach((c) => {
                const t = c.getAttribute('t'); let v = '';
                if (t === 'inlineStr') v = [...c.getElementsByTagName('t')].map((x) => x.textContent).join('');
                else { const ve = c.getElementsByTagName('v')[0]; v = ve ? ve.textContent : ''; if (t === 's') v = shared[Number(v)] || ''; }
                r[colIdx(c.getAttribute('r'))] = v;
              });
              rows[Number(row.getAttribute('r')) - 1] = Array.from(r, (x) => (x == null ? '' : x));
            });
            sheets.push({ name: s.getAttribute('name'), rows: Array.from(rows, (r) => r || []) });
          }
          return sheets;
        }
        const pad = (n) => String(n).padStart(2, '0');
        const serialDate = (v) => {   // 생년월일은 yyyy.mm.dd. 형식으로 맞춥니다 (엑셀 날짜값·2014-03-02·2014/3/2 도 변환)
          const t = String(v).trim(); const n = Number(t);
          if (t && n > 20000 && n < 80000) { const d = new Date(Math.round((n - 25569) * 86400000)); return d.getUTCFullYear() + '.' + pad(d.getUTCMonth() + 1) + '.' + pad(d.getUTCDate()) + '.'; }
          const m = t.match(/^(\d{4})\s*[-./]\s*(\d{1,2})\s*[-./]\s*(\d{1,2})\.?$/); return m ? m[1] + '.' + pad(+m[2]) + '.' + pad(+m[3]) + '.' : t;
        };
        function parseRoster(sheets) {   // 시트(이름 또는 제목에 'n반') + 머리글(번호/이름/성별/기타/생년월일[/반])
          const out = [], notes = [];
          sheets.forEach((sh) => {
            let cls = (String(sh.name).match(/(\d+)\s*반/) || [])[1];
            if (!cls) for (let i = 0; i < Math.min(3, sh.rows.length) && !cls; i++) cls = ((sh.rows[i] || []).map(String).join(' ').match(/(\d+)\s*반\s*명렬표/) || [])[1];
            let h = -1; for (let i = 0; i < Math.min(8, sh.rows.length); i++) if ((sh.rows[i] || []).some((x) => String(x).trim() === '이름')) { h = i; break; }
            if (h < 0) return;
            const col = {}; (sh.rows[h] || []).forEach((x, i) => { const t = String(x).trim(); if (t === '반') col.cls = i; else if (t === '번호') col.no = i; else if (t === '이름') col.name = i; else if (t === '성별') col.gender = i; else if (t === '기타' || t === '비고') col.note = i; else if (t === '생년월일') col.birth = i; });
            if (cls === undefined && col.cls === undefined) { notes.push('‘' + sh.name + '’ 시트: 반을 알 수 없어 건너뜁니다.'); return; }
            let seq = 0;
            sh.rows.slice(h + 1).forEach((r) => {
              seq++; const g = (k) => (col[k] === undefined ? '' : String(r[col[k]] == null ? '' : r[col[k]]).trim());
              const name = g('name'); if (!name && !g('gender') && !g('note') && !g('birth')) return;
              const c = col.cls !== undefined ? (g('cls').match(/\d+/) || [])[0] : cls; const no = col.no !== undefined ? Number(g('no')) : seq;
              if (!c || !(no >= 1 && no <= 99)) { notes.push('‘' + sh.name + '’ 시트 ' + (h + 1 + seq) + '행: 반/번호를 읽을 수 없어 건너뜁니다.'); return; }
              out.push({ cls: Number(c), no, name, gender: g('gender'), memo: g('note'), birth: serialDate(g('birth')) });
            });
          });
          return { rows: out, notes };
        }
        $('xl-up').onclick = () => $('xl-file').click();
        $('xl-file').onchange = async () => {
          const f = $('xl-file').files[0]; $('xl-file').value = ''; if (!f) return;
          try {
            const { rows, notes } = parseRoster(await readXlsx(await f.arrayBuffer()));
            const bad = rows.filter((r) => r.cls < 1 || r.cls > CC); const ok = rows.filter((r) => r.cls >= 1 && r.cls <= CC);
            if (!ok.length) return alert('올릴 명단을 찾지 못했습니다. 예시 파일의 형식(시트 이름 ‘1반’, 머리글 번호·이름·성별·기타·생년월일)을 확인해 주세요.' + (notes.length ? '\n\n' + notes.slice(0, 5).join('\n') : ''));
            const classes = [...new Set(ok.map((r) => r.cls))].sort((a, b) => a - b);
            const msg = classes.map((c) => c + '반 ' + ok.filter((r) => r.cls === c).length + '명').join(', ') + '\n\n위 반의 기존 명단은 파일 내용으로 바뀝니다(파일에 없는 번호는 비워집니다). 계속할까요?' + (bad.length ? '\n\n※ 학급 수(' + CC + '개) 밖의 반 ' + bad.length + '명은 제외됩니다.' : '') + (notes.length ? '\n\n' + notes.slice(0, 5).join('\n') : '');
            if (!confirm(msg)) return;
            $('xl-msg').textContent = '업로드 중…';
            const res = JSON.parse(await call('importStudents', ok)); if (!res.success) throw new Error(res.error);
            $('xl-msg').textContent = ok.length + '명을 올렸습니다.';
            if (window.__gpReloadGrade) window.__gpReloadGrade(); if (window.__gpReloadClass) window.__gpReloadClass();
          } catch (e) { $('xl-msg').textContent = ''; alert('엑셀을 읽지 못했습니다: ' + (e.message || e)); }
        };
        // ------------------------------------------------------------ 예시 파일
        $('xl-sample').onclick = () => {
          const sample = [['김하나', '여성', '', '2014.03.02.'], ['이둘', '남성', '', '2014.05.17.'], ['박셋', '남성', '전학생', '2014.11.30.']];
          const mk = (n) => ({ name: n + '반', widths: [8, 14, 8, 20, 18], freezeRow: 2, rows: [[cell(n + '반 명렬표', 'title')], ['번호', '이름', '성별', '기타', '생년월일'].map((v) => cell(v, 'totalLabel'))].concat(Array.from({ length: 30 }, (_, i) => { const s = n === 1 && sample[i] ? sample[i] : ['', '', '', '']; const st = GENDER[s[1]] || 'center'; return [cell(i + 1, st), cell(s[0], st), cell(s[1], st), cell(s[2], st), cell(s[3], st)]; })) });
          save([mk(1), mk(2)], '명렬표_업로드_예시');
        };
      })();
    </script>
